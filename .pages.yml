media:
  input: assets/media
  output: assets/media
  categories: [image]
  extensions: [png, jpg, jpeg, webp, avif, gif]
  rename: safe
content:
  - name: portfolio
    label: Portfolio content
    type: file
    path: content/portfolio.json
    format: json
    fields:
      - name: profile
        label: Profile and hero
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Professional title, type: string }
          - { name: bio, label: Short introduction, type: text }
          - { name: quote, label: Quote, type: string }
          - { name: location, label: Location, type: string }
          - { name: availability, label: Availability status, type: string }
          - { name: availabilityText, label: Availability label, type: string }
          - { name: availabilityDesc, label: Availability note, type: text }
          - { name: logoUrl, label: Brand logo — upload image, type: image }
          - { name: avatarUrl, label: Profile photo — upload image, type: image }
          - { name: heroBgUrl, label: Hero background — upload image, type: image }
          - { name: availBgUrl, label: Availability background — upload image, type: image }
          - { name: ctaBgUrl, label: Contact section background — upload image, type: image }
          - name: techBadges
            label: Technology badges
            type: string
            list: true
      - name: stats
        label: Portfolio statistics
        type: object
        fields:
          - { name: projects, label: Projects count, type: string }
          - { name: rating, label: Rating display, type: string }
          - { name: delivery, label: Degree or credential display, type: string }
          - { name: satisfaction, label: Region or short label, type: string }
      - name: aboutMissionText
        label: About and mission
        type: text
      - name: skills
        label: Skills
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: id, type: string, hidden: true }
          - { name: name, label: Skill, type: string }
          - { name: value, label: Proficiency display (0–100), type: number, options: { min: 0, max: 100 } }
          - { name: color, label: Gauge color, type: string }
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, type: string, hidden: true }
          - { name: title, label: Project title, type: string }
          - { name: desc, label: Short description, type: text }
          - { name: tag, label: Category, type: string }
          - { name: img, label: Project cover — upload image, type: image }
          - name: page
            label: Project details
            type: object
            fields:
              - { name: tagline, label: One-line summary, type: text }
              - { name: role, label: Your role, type: string }
              - { name: year, label: Year, type: string }
              - { name: status, label: Status, type: string }
              - { name: team, label: Team size, type: string }
              - { name: stack, label: Technology stack (comma-separated), type: string }
              - { name: layout, label: Project page layout (story or split), type: string }
              - { name: accent, label: Accent color, type: string }
              - { name: ctaText, label: Project call to action, type: text }
              - { name: liveDemoUrl, label: Live demo URL (HTTPS), type: string }
              - name: features
                label: Key features
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: Feature, type: string }
                  - { name: text, label: Description, type: text }
              - name: links
                label: Project links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - { name: label, label: Link label, type: string }
                  - { name: url, label: URL (HTTPS), type: string }
              - name: gallery
                label: Project gallery — upload screenshots or photos
                type: image
                options:
                  multiple:
                    max: 12
                  unique: true
                  extensions: [png, jpg, jpeg, webp, avif, gif]
              - name: videos
                label: Demonstration videos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: Video title, type: string }
                  - { name: url, label: YouTube, Vimeo, or HTTPS video URL, type: string }
              - name: demos
                label: Resources
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - { name: label, label: Resource label, type: string }
                  - { name: url, label: Resource URL (HTTPS), type: string }
              - name: sections
                label: Project story sections
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: id, type: string, hidden: true }
                  - { name: title, label: Section title, type: string }
                  - { name: body, label: Section content, type: text }
                  - { name: show, label: Show this section, type: boolean }
      - name: services
        label: Services
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, type: string, hidden: true }
          - { name: title, label: Service, type: string }
          - { name: desc, label: Description, type: text }
          - { name: icon, label: Font Awesome icon class, type: string }
      - name: education
        label: Education
        type: object
        fields:
          - { name: institution, label: Institution, type: string }
          - { name: degree, label: Qualification, type: string }
          - { name: years, label: Dates, type: string }
          - { name: footerText, label: Supporting line, type: string }
      - name: cta
        label: Contact section text
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: subtext, label: Description, type: text }
      - name: contact
        label: Public contact details
        type: object
        fields:
          - { name: email, label: Public email address, type: string }
          - { name: phone, label: Public phone number, type: string }
          - { name: whatsapp, label: Public WhatsApp number, type: string }
          - { name: github, label: GitHub profile, type: string }
          - { name: linkedin, label: LinkedIn profile, type: string }
          - { name: formEndpoint, label: HTTPS form provider endpoint (public URL), type: string }
          - { name: siteUrl, label: Published portfolio URL, type: string }
      - name: theme
        label: Visual theme
        type: object
        fields:
          - { name: brandColor, label: Brand color, type: string }
          - { name: cardRadius, label: Card corner radius, type: number }
          - { name: heroGradStart, label: Hero gradient start, type: string }
          - { name: heroGradMiddle, label: Hero gradient middle, type: string }
          - { name: heroGradEnd, label: Hero gradient end, type: string }
          - { name: heroGradStrength, label: Hero overlay strength, type: number, options: { min: 0, max: 100 } }
          - { name: heroGradAngle, label: Hero gradient angle, type: number, options: { min: 0, max: 360 } }
          - { name: availGradStart, label: Availability gradient start, type: string }
          - { name: availGradEnd, label: Availability gradient end, type: string }
          - { name: availGradStrength, label: Availability overlay strength, type: number, options: { min: 0, max: 100 } }
          - { name: ctaGradStart, label: Contact gradient start, type: string }
          - { name: ctaGradEnd, label: Contact gradient end, type: string }
          - { name: ctaGradStrength, label: Contact overlay strength, type: number, options: { min: 0, max: 100 } }
      - name: layoutOrder
        label: Section order IDs
        type: string
        list: true
      - name: blockVisibility
        label: Section visibility
        type: object
        fields:
          - { name: sectionBlockAboutSkills, label: About and skills section, type: boolean }
          - { name: sectionBlockProjects, label: Projects section, type: boolean }
          - { name: sectionBlockServicesEdu, label: Services and education section, type: boolean } 
          - { name: sectionBlockCTA, label: Contact section, type: boolean }
