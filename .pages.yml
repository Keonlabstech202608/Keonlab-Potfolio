# Separate media libraries make each upload purpose easy to identify in Pages CMS.
# Every image field below is linked to its matching folder.
media:
  - name: logos
    label: Brand logos
    input: assets/media/logos
    output: assets/media/logos
    categories: [image]
    extensions: [png, jpg, jpeg, webp, avif, svg]
    rename: safe
  - name: profile_photos
    label: Profile photos
    input: assets/media/profile
    output: assets/media/profile
    categories: [image]
    extensions: [png, jpg, jpeg, webp, avif]
    rename: safe
  - name: hero_backgrounds
    label: Hero backgrounds
    input: assets/media/hero-backgrounds
    output: assets/media/hero-backgrounds
    categories: [image]
    extensions: [png, jpg, jpeg, webp, avif]
    rename: safe
  - name: availability_backgrounds
    label: Availability backgrounds
    input: assets/media/availability-backgrounds
    output: assets/media/availability-backgrounds
    categories: [image]
    extensions: [png, jpg, jpeg, webp, avif]
    rename: safe
  - name: contact_backgrounds
    label: Contact backgrounds
    input: assets/media/contact-backgrounds
    output: assets/media/contact-backgrounds
    categories: [image]
    extensions: [png, jpg, jpeg, webp, avif]
    rename: safe
  - name: project_covers
    label: Project cover images
    input: assets/media/project-covers
    output: assets/media/project-covers
    categories: [image]
    extensions: [png, jpg, jpeg, webp, avif]
    rename: safe
  - name: project_galleries
    label: Project gallery screenshots
    input: assets/media/project-galleries
    output: assets/media/project-galleries
    categories: [image]
    extensions: [png, jpg, jpeg, webp, avif, gif]
    rename: safe
content:
  - name: portfolio
    label: Portfolio content
    type: file
    path: content/portfolio.json
    format: json
    fields:
      - name: profile
        label: Profile and hero
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Professional title, type: string }
          - { name: bio, label: Short introduction, type: text }
          - { name: quote, label: Quote, type: string }
          - { name: location, label: Location, type: string }
          - { name: availability, label: Availability status, type: string }
          - { name: availabilityText, label: Availability label, type: string }
          - { name: availabilityDesc, label: Availability note, type: text }
          - name: logoUrl
            label: Current brand logo (keep this image)
            type: string
            description: Existing image URL or path. Leave unchanged to keep the current logo.
          - name: logoUpload
            label: Replace brand logo (optional)
            type: image
            description: Leave empty to keep the current logo. Upload here only when you want to replace it.
            options: { media: logos }
          - name: avatarUrl
            label: Current profile photo (keep this image)
            type: string
            description: Existing image URL or path. Leave unchanged to keep the current photo.
          - name: avatarUpload
            label: Replace profile photo (optional)
            type: image
            description: Leave empty to keep the current photo. Upload here only when you want to replace it.
            options: { media: profile_photos }
          - name: heroBgUrl
            label: Current hero background (keep this image)
            type: string
            description: Existing image URL or path. Leave unchanged to keep the current background.
          - name: heroBgUpload
            label: Replace hero background (optional)
            type: image
            description: Leave empty to keep the current background. Upload here only when you want to replace it.
            options: { media: hero_backgrounds }
          - name: availBgUrl
            label: Current availability background (keep this image)
            type: string
            description: Existing image URL or path. Leave unchanged to keep the current background.
          - name: availBgUpload
            label: Replace availability background (optional)
            type: image
            description: Leave empty to keep the current background. Upload here only when you want to replace it.
            options: { media: availability_backgrounds }
          - name: ctaBgUrl
            label: Current contact background (keep this image)
            type: string
            description: Existing image URL or path. Leave unchanged to keep the current background.
          - name: ctaBgUpload
            label: Replace contact background (optional)
            type: image
            description: Leave empty to keep the current background. Upload here only when you want to replace it.
            options: { media: contact_backgrounds }
          - name: techBadges
            label: Technology badges
            type: string
            list: true
      - name: stats
        label: Portfolio statistics
        type: object
        fields:
          - { name: projects, label: Projects count, type: string }
          - { name: rating, label: Rating display, type: string }
          - { name: delivery, label: Degree or credential display, type: string }
          - { name: satisfaction, label: Region or short label, type: string }
      - name: aboutMissionText
        label: About and mission
        type: text
      - name: skills
        label: Skills
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: id, type: string, hidden: true }
          - { name: name, label: Skill, type: string }
          - { name: value, label: Proficiency display (0–100), type: number, options: { min: 0, max: 100 } }
          - { name: color, label: Gauge color, type: string }
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, type: string, hidden: true }
          - { name: title, label: Project title, type: string }
          - { name: desc, label: Short description, type: text }
          - { name: tag, label: Category, type: string }
          - name: img
            label: Current project cover (keep this image)
            type: string
            description: Existing image URL or path. Leave unchanged to keep the current project cover.
          - name: imgUpload
            label: Replace project cover (optional)
            type: image
            description: Leave empty to keep the current cover. Upload here only when you want to replace it.
            options: { media: project_covers }
          - name: page
            label: Project details
            type: object
            fields:
              - { name: showProjectPage, label: Show the full project details page, type: boolean }
              - { name: showCover, label: Show project cover image, type: boolean }
              - { name: showTitle, label: Show project title, type: boolean }
              - { name: showCategory, label: Show project category, type: boolean }
              - { name: showMetadata, label: Show project information (role, year, status and team), type: boolean }
              - { name: showLinks, label: Show project links, type: boolean }
              - { name: showFeatures, label: Show key features section, type: boolean }
              - { name: showGallery, label: Show project images gallery, type: boolean }
              - { name: showVideos, label: Show video demonstrations, type: boolean }
              - { name: showResources, label: Show resources section, type: boolean }
              - { name: showNextProject, label: Show next project suggestion, type: boolean }
              - { name: tagline, label: One-line summary, type: text }
              - { name: showTagline, label: Show one-line summary, type: boolean }
              - { name: role, label: Your role, type: string }
              - { name: showRole, label: Show role, type: boolean }
              - { name: year, label: Year, type: string }
              - { name: showYear, label: Show year, type: boolean }
              - { name: status, label: Status, type: string }
              - { name: showStatus, label: Show status, type: boolean }
              - { name: team, label: Team size, type: string }
              - { name: showTeam, label: Show team size, type: boolean }
              - { name: stack, label: Technology stack (comma-separated), type: string }
              - { name: showStack, label: Show technology stack, type: boolean }
              - { name: layout, label: Project page layout (story or split), type: string }
              - { name: accent, label: Accent color, type: string }
              - { name: ctaText, label: Project call to action, type: text }
              - { name: showCTA, label: Show project call to action, type: boolean }
              - { name: liveDemoUrl, label: Live demo URL (HTTPS), type: string }
              - { name: showLiveDemo, label: Show live demo link, type: boolean }
              - name: features
                label: Key features
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: Feature, type: string }
                  - { name: text, label: Description, type: text }
                  - { name: show, label: Show this feature on the website, type: boolean }
              - name: links
                label: Project links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - { name: label, label: Link label, type: string }
                  - { name: url, label: URL (HTTPS), type: string }
                  - { name: show, label: Show this link, type: boolean }
              - name: gallery
                label: Current gallery image URLs or paths (keep these)
                type: string
                list: true
                description: Existing gallery image URLs or paths. Leave these unchanged to keep the current gallery.
              - name: galleryUploads
                label: Add or replace gallery images (optional)
                type: image
                description: Upload additional screenshots here. Existing gallery images are kept. Clear this field to remove only the uploaded additions.
                options:
                  media: project_galleries
                  multiple:
                    max: 12
                  unique: true
                  extensions: [png, jpg, jpeg, webp, avif, gif]
              - name: videos
                label: Demonstration videos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: Video title, type: string }
                  - { name: url, label: YouTube, Vimeo, or HTTPS video URL, type: string }
                  - { name: show, label: Show this video, type: boolean }
              - name: demos
                label: Resources
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - { name: label, label: Resource label, type: string }
                  - { name: url, label: Resource URL (HTTPS), type: string }
                  - { name: show, label: Show this resource, type: boolean }
              - name: sections
                label: Project story sections
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: id, type: string, hidden: true }
                  - { name: title, label: Section title, type: string }
                  - { name: body, label: Section content, type: text }
                  - { name: show, label: Show this section, type: boolean }
      - name: services
        label: Services
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, type: string, hidden: true }
          - { name: title, label: Service, type: string }
          - { name: desc, label: Description, type: text }
          - { name: icon, label: Font Awesome icon class, type: string }
      - name: education
        label: Education
        type: object
        fields:
          - { name: institution, label: Institution, type: string }
          - { name: degree, label: Qualification, type: string }
          - { name: years, label: Dates, type: string }
          - { name: footerText, label: Supporting line, type: string }
      - name: cta
        label: Contact section text
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: subtext, label: Description, type: text }
      - name: contact
        label: Public contact details
        type: object
        fields:
          - { name: email, label: Public email address, type: string }
          - { name: phone, label: Public phone number, type: string }
          - { name: whatsapp, label: Public WhatsApp number, type: string }
          - { name: github, label: GitHub profile, type: string }
          - { name: linkedin, label: LinkedIn profile, type: string }
          - { name: formEndpoint, label: HTTPS form provider endpoint (public URL), type: string }
          - { name: siteUrl, label: Published portfolio URL, type: string }
      - name: theme
        label: Visual theme
        type: object
        fields:
          - { name: brandColor, label: Brand color, type: string }
          - { name: cardRadius, label: Card corner radius, type: number }
          - { name: heroGradStart, label: Hero gradient start, type: string }
          - { name: heroGradMiddle, label: Hero gradient middle, type: string }
          - { name: heroGradEnd, label: Hero gradient end, type: string }
          - { name: heroGradStrength, label: Hero overlay strength, type: number, options: { min: 0, max: 100 } }
          - { name: heroGradAngle, label: Hero gradient angle, type: number, options: { min: 0, max: 360 } }
          - { name: availGradStart, label: Availability gradient start, type: string }
          - { name: availGradEnd, label: Availability gradient end, type: string }
          - { name: availGradStrength, label: Availability overlay strength, type: number, options: { min: 0, max: 100 } }
          - { name: ctaGradStart, label: Contact gradient start, type: string }
          - { name: ctaGradEnd, label: Contact gradient end, type: string }
          - { name: ctaGradStrength, label: Contact overlay strength, type: number, options: { min: 0, max: 100 } }
      - name: layoutOrder
        label: Section order IDs
        type: string
        list: true
      - name: blockVisibility
        label: Section visibility
        type: object
        fields:
          - { name: sectionBlockAboutSkills, label: About and skills section, type: boolean }
          - { name: sectionBlockProjects, label: Projects section, type: boolean }
          - { name: sectionBlockServicesEdu, label: Services and education section, type: boolean }
          - { name: sectionBlockCTA, label: Contact section, type: boolean }
